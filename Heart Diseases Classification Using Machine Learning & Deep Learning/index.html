<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Assessment</title>

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right, #83bccf, #77bcc9);
    padding:40px;
    background-image:"background2.jpg";
}


.login{
    width:900px;
    max-width:95%;
    background:#71c8d7;
    border:3px solid #1976d2;
    border-radius:18px;
    padding:40px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.login h1{
    text-align:center;
    color:#1565c0;
    margin-bottom:35px;
    font-size:36px;
}

label{
    display:block;
    margin-bottom:8px;
    margin-top:18px;
    font-size:16px;
    font-weight:bold;
    color:#333;
}

input,
select{
    width:100%;
    padding:14px 15px;
    font-size:16px;
    border:1px solid #fa8787;
    border-radius:8px;
    outline:none;
    transition:.3s;
}

input:focus,
select:focus{
    border-color:#9dc3ea;
    box-shadow:0 0 8px rgba(25,118,210,.35);
}

.btn{
    width:100%;
    margin-top:35px;
    padding:18px;
    font-size:22px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:rgb(91, 191, 204);
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#0d47a1;
    transform:scale(1.02);
}

h3{
    margin-top:30px;
    text-align:center;
    font-size:26px;
}

@media(max-width:768px){

.login{
    padding:25px;
}

.login h1{
    font-size:28px;
}

.btn{
    font-size:20px;
}

}
    </style>
</head>

<body>

<div class="login">

    <h1 style="color:blue;">Heart Disease Risk Assessment System</h1>

    <form action="http://localhost:8000/predict-form" method="post">

        <label for="age">Age (years):</label>
        <input type="number" id="age" name="age" placeholder="Enter Age" min="1" max="120" required>
        <br><br>

        <label for="sex">Gender:</label>
        <select id="sex" name="sex" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        <br><br>

        <label for="hdl">HDL Cholesterol (mg/dL):</label>
        <input type="number" step="0.1" id="hdl" name="hdl" placeholder="Enter HDL Cholesterol" required>
        <br><br>

        <label for="ldl">LDL Cholesterol (mg/dL):</label>
        <input type="number" step="0.1" id="ldl" name="ldl" placeholder="Enter LDL Cholesterol" required>
        <br><br>

        <label for="hba1c">HbA1c (%):</label>
        <input type="number" step="0.1" id="hba1c" name="hba1c" placeholder="Enter HbA1c" required>
        <br><br>

        <label for="max_heart_rate_achieved">Maximum Heart Rate Achieved:</label>
        <input type="number" id="max_heart_rate_achieved" name="max_heart_rate_achieved"
               placeholder="Enter Maximum Heart Rate" required>
        <br><br>

        <label for="chest_pain_type">Chest Pain Type:</label>
        <select id="chest_pain_type" name="chest_pain_type" required>
            <option value="Asymptomatic">Asymptomatic</option>
            <option value="Non-Anginal Pain">Non-Anginal Pain</option>
            <option value="Atypical Angina">Atypical Angina</option>
            <option value="Typical Angina">Typical Angina</option>
        </select>
        <br><br>

        <label for="exercise_induced_angina">Exercise-Induced Angina:</label>
        <select id="exercise_induced_angina" name="exercise_induced_angina" required>
            <option value="FALSE">False</option>
            <option value="TRUE">True</option>
        </select>
        <br><br>

        <label for="st_depression">ST Depression (mm):</label>
        <input type="number" step="0.1" id="st_depression" name="st_depression"
               placeholder="Enter ST Depression" required>
        <br><br>

        <label for="smoker_status">Smoker Status:</label>
        <select id="smoker_status" name="smoker_status" required>
            <option value="Never">Never</option>
            <option value="Former">Former</option>
            <option value="Current">Current</option>
        </select>
        <br><br>

        <button type="submit" class="btn btn-primary btn-block btn-large">
            Predict
        </button>

    </form>


</div>

</body>
</html>
